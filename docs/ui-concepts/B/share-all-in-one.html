<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>板书拾记 · B 纸感学术 · UI 整合分享版</title>
<!--
  单文件整合版：把 base.css / mini-course.html / mini-note.html / web.html 合为一份。
  零外部依赖（无字体、无图片、无脚本 CDN），双击即可离线打开，可直接作为附件分享。
  三个界面按 .view-course / .view-note / .view-web 做 CSS 作用域隔离，视觉与原件一致。
-->
<style>
/* ============================================================
   1. 共享设计令牌与组件（原 base.css，原样内联）
   ============================================================ */
:root {
  --paper: #F7F4EA;
  --card: #FFFEF9;
  --ink: #26251F;
  --ink-2: #6F6A5B;
  --ink-3: #9A9482;
  --green: #285847;
  --green-deep: #1E4636;
  --green-soft: #E9F0E6;
  --green-line: #CBDCC8;
  --line: #E3DECE;
  --board: #2A4A3A;
  --chalk: #F1EFE2;
  --wood: #A98B60;
  --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --sans: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --math-font: "STIX Two Text", "Times New Roman", "Latin Modern Roman", Georgia, serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, .serif { font-family: var(--serif); font-weight: 600; }

/* ---------- 数学公式（手写排版，无外部依赖） ---------- */
.math { font-family: var(--math-font); font-style: italic; white-space: nowrap; }
.math .up { font-style: normal; }
.frac { display: inline-flex; flex-direction: column; vertical-align: -0.45em; text-align: center; line-height: 1.2; margin: 0 .12em; }
.frac .num { padding: 0 .25em; border-bottom: 1px solid currentColor; }
.frac .den { padding: 0 .25em; }
.bigop { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; vertical-align: middle; margin: 0 .18em; }
.bigop .sym { font-size: 1.75em; font-style: normal; line-height: .95; }
.bigop .hi, .bigop .lo { font-size: .58em; font-style: normal; line-height: 1.1; }
.limop { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1; margin: 0 .1em; }
.limop .word { font-style: normal; font-size: .92em; }
.limop .under { font-size: .6em; font-style: normal; }
sub, sup { font-size: .68em; font-style: normal; }

/* ---------- 黑板 ---------- */
.board {
  position: relative;
  background:
    radial-gradient(130% 120% at 24% 12%, rgba(255,255,255,.055), transparent 55%),
    radial-gradient(90% 110% at 82% 90%, rgba(0,0,0,.22), transparent 60%),
    linear-gradient(155deg, #37594A, #27432F 62%, #1F3828);
  color: var(--chalk);
  border: 3px solid var(--wood);
  outline: 1px solid rgba(0,0,0,.28);
  box-shadow: inset 0 0 34px rgba(0,0,0,.36);
  font-family: "Kaiti SC", "KaiTi", "STKaiti", var(--serif);
}
.board .chalk-math { font-family: var(--math-font); font-style: italic; }
.board .frame-light { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.14); }

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex; align-items: center; gap: .45em;
  border: 1px solid var(--green); border-radius: 8px;
  padding: .52em 1.15em; font-size: 13.5px; line-height: 1.4;
  background: var(--card); color: var(--green);
  cursor: pointer; user-select: none; white-space: nowrap;
}
.btn:hover { background: var(--green-soft); }
.btn.primary { background: var(--green); color: #F6F3E6; }
.btn.primary:hover { background: var(--green-deep); }
.btn svg { width: 1.05em; height: 1.05em; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- 定义徽章 / 小节标题 ---------- */
.pill {
  display: inline-block; background: var(--green); color: #F6F3E6;
  font-size: 12px; line-height: 1; padding: .32em .7em; border-radius: 5px;
  margin-right: .6em; vertical-align: .08em;
}
.sec-bar { border-left: 3px solid var(--green); padding-left: .6em; }

/* ---------- 状态栏（小程序屏） ---------- */
.statusbar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 9px 20px 4px; font-size: 14px; font-weight: 600; color: var(--ink);
}
.statusbar .icons { display: inline-flex; align-items: center; gap: 5px; }
.statusbar svg { display: block; }

/* ---------- 小程序胶囊 ---------- */
.capsule {
  display: inline-flex; align-items: center;
  border: 1px solid rgba(0,0,0,.14); border-radius: 999px;
  background: rgba(255,255,255,.75); overflow: hidden;
}
.capsule span { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 26px; }
.capsule span + span { border-left: 1px solid rgba(0,0,0,.14); }

/* ---------- 底部标签栏（小程序屏） ---------- */
.tabbar { display: flex; border-top: 1px solid var(--line); background: var(--card); }
.tabbar .tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 7px 0 9px; font-size: 11px; color: var(--ink-2);
}
.tabbar .tab.active { color: var(--green); }
.tabbar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ============================================================
   2. 分享外壳（所有类名 sh- 前缀，与三个界面零冲突）
   ============================================================ */
.sh-shell { max-width: 1400px; margin: 0 auto; padding: 26px 24px 40px; }
.sh-head {
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 20px 26px; margin-bottom: 14px;
  display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap;
}
.sh-head .sh-kicker {
  font-size: 11.5px; letter-spacing: .16em; color: var(--green);
  border: 1px solid var(--green-line); background: var(--green-soft);
  border-radius: 4px; padding: .18em .7em; margin-bottom: 8px; display: inline-block;
}
.sh-head h1 { font-size: 26px; color: var(--ink); letter-spacing: .03em; }
.sh-head .sh-sub { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
.sh-head .sh-meta { margin-left: auto; font-size: 12px; color: var(--ink-3); text-align: right; line-height: 1.9; }

.sh-bar {
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 14px; margin-bottom: 16px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.sh-nav { display: flex; gap: 8px; flex-wrap: wrap; }
.sh-nav button {
  font-family: var(--sans); font-size: 13.5px; line-height: 1.4;
  border: 1px solid var(--line); border-radius: 7px;
  background: var(--card); color: var(--ink-2);
  padding: .5em 1.05em; cursor: pointer; white-space: nowrap;
}
.sh-nav button:hover { border-color: var(--green-line); background: var(--green-soft); color: var(--green); }
.sh-nav button[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #F6F3E6; }
.sh-bar .sh-hint { margin-left: auto; font-size: 12px; color: var(--ink-3); }

.sh-stage { position: relative; width: 100%; overflow: hidden; }
.sh-canvas {
  display: flex; align-items: flex-start; gap: 28px;
  width: max-content; transform-origin: top left;
}
.sh-item { display: block; }
.sh-cap {
  font-size: 12.5px; color: var(--ink-2); padding: 0 0 8px 2px;
  font-family: var(--serif); letter-spacing: .02em;
}
.sh-cap b { color: var(--green); font-weight: 600; margin-right: .5em; }
.sh-canvas:not([data-mode="all"]) .sh-cap { display: none; }
.sh-canvas[data-mode="course"] .sh-item:not([data-view="course"]),
.sh-canvas[data-mode="note"]   .sh-item:not([data-view="note"]),
.sh-canvas[data-mode="web"]    .sh-item:not([data-view="web"]) { display: none; }

.sh-foot { margin-top: 16px; font-size: 12px; color: var(--ink-3); line-height: 1.9; }
.sh-foot code { font-family: var(--math-font); background: var(--green-soft); border-radius: 3px; padding: 0 .35em; color: var(--green); }
.sh-toast {
  position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 12px);
  background: var(--ink); color: var(--paper); font-size: 13px;
  padding: 9px 18px; border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,.2);
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 99;
}
.sh-toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ============================================================
   3. 两个小程序页共享的屏幕组件（原文件相同部分合并）
   ============================================================ */
.phone {
  width: 375px; height: 760px; background: var(--card);
  border: 1px solid var(--line); border-radius: 30px;
  box-shadow: 0 10px 34px rgba(60,52,30,.14);
  display: flex; flex-direction: column; overflow: hidden;
}
.navbar {
  display: flex; align-items: center; justify-content: center;
  position: relative; padding: 10px 14px; border-bottom: 1px solid var(--line);
}
.navbar .title { font-family: var(--serif); font-size: 16.5px; color: var(--ink); }
.navbar .capsule { position: absolute; right: 14px; }
.capsule svg { width: 15px; height: 15px; fill: var(--ink-2); stroke: none; }
.capsule .dot { border-radius: 50%; width: 15px; height: 15px; border: 1.5px solid var(--ink-2); position: relative; }
.capsule .dot::after { content: ""; position: absolute; inset: 3.5px; border-radius: 50%; background: var(--ink-2); }
.page { flex: 1; overflow: hidden; }
.tabbar .tab[data-go], [data-go], [data-toast] { cursor: pointer; }

/* ============================================================
   4. 小程序 · 课程页（原 mini-course.html 专属样式）
   ============================================================ */
.view-course .page { padding: 20px 18px 0; display: flex; flex-direction: column; }
.view-course .page-title { font-family: var(--serif); font-size: 27px; margin-bottom: 4px; }
.view-course .underline { width: 34px; height: 3px; background: var(--green); border-radius: 1px; margin-bottom: 16px; }
.view-course .upload-btn {
  display: flex; align-items: center; justify-content: center; gap: .5em;
  background: var(--green); color: #F6F3E6; border-radius: 9px;
  padding: 12px; font-size: 15px; margin-bottom: 22px; cursor: pointer;
}
.view-course .upload-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.view-course .course-card {
  display: flex; align-items: center; gap: 12px;
  border: 1px solid var(--line); border-radius: 10px; background: #FFFDF6;
  padding: 12px; cursor: pointer;
}
.view-course .course-card:hover { border-color: var(--green-line); background: var(--green-soft); }
.view-course .cover {
  width: 86px; height: 64px; flex: none; border-radius: 6px; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 12px; line-height: 1.5; text-align: center;
}
.view-course .cover .m { margin-top: 3px; font-size: 13px; }
.view-course .cc-body { flex: 1; min-width: 0; }
.view-course .cc-body h3 { font-size: 15px; color: var(--ink); margin-bottom: 4px; }
.view-course .cc-body .meta { font-size: 12px; color: var(--ink-2); }
.view-course .cc-chev { flex: none; width: 16px; height: 16px; fill: none; stroke: var(--ink-3); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ============================================================
   5. 小程序 · 笔记页（原 mini-note.html 专属样式）
   ============================================================ */
.view-note .navbar .back {
  position: absolute; left: 14px; width: 18px; height: 18px;
  fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}
.view-note .page { padding: 14px 18px 0; }
.view-note .page-title { font-family: var(--serif); font-size: 24px; margin-bottom: 8px; }
.view-note .crumbs {
  display: flex; align-items: center; font-size: 13px; color: var(--ink-2);
  padding-bottom: 9px; border-bottom: 1px solid var(--line); margin-bottom: 12px;
}
.view-note .crumbs svg { width: 14px; height: 14px; fill: none; stroke: var(--ink-3); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; margin-left: auto; }
.view-note h3.sec { font-size: 18px; margin-bottom: 8px; }
.view-note .note-p { font-size: 13.5px; text-align: justify; }
.view-note .formula-center { text-align: center; font-size: 15px; margin: 8px 0; }
.view-note .defline { font-size: 13.5px; text-align: justify; margin-bottom: 7px; }
.view-note .formula-card {
  background: var(--green-soft); border: 1px solid var(--green-line); border-radius: 6px;
  padding: 9px; text-align: center; font-size: 14px;
}
.view-note .origin { margin-top: 13px; }
.view-note .origin h3 { font-size: 15px; margin-bottom: 8px; }
.view-note .origin h3 small { font-family: var(--sans); font-weight: 400; color: var(--ink-3); font-size: 12px; }
.view-note .origin .board { height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12.5px; line-height: 1.8; padding: 0 14px; text-align: center; }
.view-note .origin-foot { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.view-note .play-chip {
  display: inline-flex; align-items: center; gap: .45em;
  border: 1px solid var(--line); border-radius: 999px; background: var(--card);
  padding: 7px 14px; font-size: 12.5px; color: var(--ink); cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.view-note .play-chip svg { width: 12px; height: 12px; fill: var(--green); stroke: none; }
.view-note .origin-foot .spacer { flex: 1; }
.view-note .export-btn {
  display: inline-flex; align-items: center; gap: .45em;
  background: var(--green); color: #F6F3E6; border-radius: 9px;
  padding: 7px 15px; font-size: 13px; cursor: pointer;
}
.view-note .export-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ============================================================
   6. Web 结果页（原 web.html 专属样式，全部限定在 .view-web 内）
   ============================================================ */
.view-web { width: 1240px; }
.view-web .app {
  width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 2px 18px rgba(60,52,30,.07); overflow: hidden;
}
.view-web .topbar {
  display: flex; align-items: center; gap: 34px;
  padding: 18px 34px 14px; border-bottom: 1px solid var(--line);
}
.view-web .brand { display: flex; align-items: baseline; gap: 12px; }
.view-web .brand h1 { font-size: 25px; color: var(--green); letter-spacing: .04em; }
.view-web .brand small { color: var(--ink-2); font-size: 12.5px; letter-spacing: .12em; }
.view-web .nav { display: flex; gap: 30px; margin-left: 12px; }
.view-web .nav a { color: var(--ink-2); text-decoration: none; font-size: 15px; padding: 4px 2px; position: relative; }
.view-web .nav a.active { color: var(--ink); font-weight: 600; }
.view-web .nav a.active::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -6px;
  height: 2px; background: var(--green); border-radius: 1px;
}
.view-web .topbar .spacer { flex: 1; }
.view-web .btn.newtask { border-radius: 8px; }

.view-web .main { display: grid; grid-template-columns: 208px minmax(0,1fr) 316px; }
.view-web .side { border-right: 1px solid var(--line); padding: 22px 0 24px; }
.view-web .side .course-name {
  font-family: var(--serif); font-size: 17px; color: var(--ink);
  padding: 0 22px 14px; border-bottom: 1px solid var(--line); margin-bottom: 14px;
}
.view-web .side .label { font-size: 12.5px; color: var(--ink-3); padding: 0 22px 8px; letter-spacing: .08em; }
.view-web .side ol { list-style: none; }
.view-web .side ol a { display: block; padding: 8.5px 22px; color: var(--ink-2); text-decoration: none; font-size: 14px; }
.view-web .side ol a:hover { background: var(--paper); color: var(--ink); }
.view-web .side ol a.active { background: var(--green-soft); color: var(--green); font-weight: 600; box-shadow: inset 3px 0 0 var(--green); }

.view-web .stage { padding: 24px 30px 28px; min-width: 0; }
.view-web .stage-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.view-web .stage-head h2 { font-size: 21px; }
.view-web .badge-demo {
  font-size: 11.5px; color: var(--green); background: var(--green-soft);
  border: 1px solid var(--green-line); border-radius: 4px; padding: .22em .6em;
}
.view-web .player { border-radius: 6px; overflow: hidden; box-shadow: 0 3px 14px rgba(40,50,35,.16); }
.view-web .board.screen { padding: 30px 44px 26px; }
.view-web .board.screen .line { text-align: center; font-size: 19px; line-height: 2.1; letter-spacing: .03em; }
.view-web .board.screen .title { font-size: 24px; margin-bottom: 10px; letter-spacing: .08em; }
.view-web .board.screen .math { font-size: 1.05em; }
.view-web .defbox {
  border: 1.5px dashed rgba(241,239,226,.75); border-radius: 4px;
  padding: 12px 26px; margin: 10px auto 4px; max-width: 640px;
}
.view-web .playerbar {
  display: flex; align-items: center; gap: 14px;
  background: #1C241F; color: #D8D5C6; padding: 10px 16px; font-size: 12.5px;
}
.view-web .playerbar svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; cursor: pointer; }
.view-web .pbar { flex: 1; position: relative; height: 4px; background: rgba(216,213,198,.28); border-radius: 2px; }
.view-web .pbar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 14%; background: var(--green); border-radius: 2px; }
.view-web .pbar .knob {
  position: absolute; left: 14%; top: 50%; transform: translate(-50%, -50%);
  width: 12px; height: 12px; border-radius: 50%; background: #EDEAE0;
  box-shadow: 0 1px 3px rgba(0,0,0,.4);
}
.view-web .tcurrent { color: #EDEAE0; }
.view-web .ttotal { color: #8E948B; }

.view-web .evidence { margin-top: 24px; }
.view-web .evidence h3 { font-size: 15.5px; margin-bottom: 12px; }
.view-web .evidence h3 small { font-family: var(--sans); font-weight: 400; color: var(--ink-3); font-size: 12px; margin-left: 8px; }
.view-web .ev-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.view-web .ev-card { cursor: pointer; }
.view-web .ev-card .board { height: 74px; display: flex; align-items: center; justify-content: center; font-size: 15px; }
.view-web .ev-card .ts { margin-top: 6px; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.view-web .ev-card.selected .board { outline: 2px solid var(--green); outline-offset: 2px; }
.view-web .ev-card.selected .ts { color: var(--green); font-weight: 600; }
.view-web .ev-card:hover .board { outline: 2px solid var(--green-line); outline-offset: 2px; }
.view-web .ev-card.selected:hover .board { outline-color: var(--green); }

.view-web .notes { border-left: 1px solid var(--line); padding: 24px 26px 28px; display: flex; flex-direction: column; gap: 16px; }
.view-web .notes .actions { display: flex; gap: 10px; }
.view-web .notes .actions .btn { flex: 1; justify-content: center; }
.view-web .note-head { font-size: 13px; color: var(--ink-2); border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.view-web .note-head b { color: var(--ink); font-weight: 600; }
.view-web .note-card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 18px 18px 20px; }
.view-web .note-card h3 { font-size: 17px; margin-bottom: 10px; }
.view-web .note-card p { font-size: 13.8px; color: var(--ink); text-align: justify; }
.view-web .note-card .formula-center { text-align: center; font-size: 17px; margin: 12px 0; }
.view-web .defline { margin: 10px 0; font-size: 13.8px; text-align: justify; }
.view-web .formula-card {
  background: var(--green-soft); border: 1px solid var(--green-line); border-radius: 6px;
  padding: 12px; text-align: center; font-size: 16px; margin-top: 10px;
}
.view-web .origin-link {
  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--line); border-radius: 8px; padding: 11px 14px;
  color: var(--ink); text-decoration: none; font-size: 13.5px; background: var(--card);
}
.view-web .origin-link:hover { border-color: var(--green-line); background: var(--green-soft); }
.view-web .origin-link svg { width: 16px; height: 16px; fill: none; stroke: var(--green); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.view-web .origin-link .chev { margin-left: auto; stroke: var(--ink-3); }
/* 原 web.html 的 @media(max-width:1080px) 两栏降级改由外层统一缩放处理，保证任何屏宽下三栏布局不失真 */

/* ============================================================
   7. 打印 / 导出 PDF（隐藏外壳，三个界面顺次排布）
   ============================================================ */
@media print {
  @page { size: A4 landscape; margin: 8mm; }
  .sh-head, .sh-bar, .sh-foot, .sh-toast { display: none !important; }
  .sh-shell { max-width: none; padding: 0; }
  .sh-stage { overflow: visible !important; height: auto !important; }

  var stage  = document.getElementById('shStage');
  var toast  = document.getElementById('shToast');
  var navBtns = Array.prototype.slice.call(document.querySelectorAll('.sh-nav button'));
  var toastTimer = null;

  /* 画布按可用宽度整体等比缩放；transform 不改变 offsetWidth，可安全测量原始尺寸 */
  function fit() {
    canvas.style.transform = 'none';
    stage.style.height = '';
    var naturalW = canvas.offsetWidth;
    var naturalH = canvas.offsetHeight;
    var avail = stage.clientWidth;
    if (!naturalW || !avail) return;
    var scale = Math.min(1, avail / naturalW);
    canvas.style.transform = 'scale(' + scale + ')';
    stage.style.height = Math.ceil(naturalH * scale) + 'px';
  }

  function readHash() {
    var v = location.hash.replace(/^#/, '');
    return VIEWS.indexOf(v) > -1 ? v : 'all';
  }

  function applyView(v) {
    canvas.dataset.mode = v;
    navBtns.forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.view === v));
    });
    fit();
  }

  function setView(v) {
    if (VIEWS.indexOf(v) < 0) return;
    if (readHash() === v) { applyView(v); return; }
    location.hash = v; /* hashchange 里统一 applyView */
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove('on'); }, 2000);
  }

  /* Web 证据卡：点击切换选中态并同步播放器时间/进度（演示数据，总时长 45:20） */
  var TOTAL = 2720;
  function selectEvidence(card) {
    document.querySelectorAll('#evRow .ev-card').forEach(function (c) { c.classList.remove('selected'); });
    card.classList.add('selected');
    var ts = card.querySelector('.ts').textContent.trim();
    var pct = Math.min(100, Math.max(0, Number(card.dataset.sec) / TOTAL * 100));
    var cur = document.querySelector('.view-web .tcurrent');
    var fill = document.querySelector('.view-web .pbar .fill');
    var knob = document.querySelector('.view-web .pbar .knob');
    if (cur) cur.textContent = ts;
    if (fill) fill.style.width = pct + '%';
    if (knob) knob.style.left = pct + '%';
  }

  document.addEventListener('click', function (e) {
    var nav = e.target.closest('.sh-nav button');
    if (nav) { setView(nav.dataset.view); return; }

    var evCard = e.target.closest('.ev-card');
    if (evCard) { selectEvidence(evCard); return; }

    var go = e.target.closest('[data-go]');
    if (go) { e.preventDefault(); setView(go.dataset.go); return; }

    var tip = e.target.closest('[data-toast]');
    if (tip) { e.preventDefault(); showToast(tip.dataset.toast); return; }

    var deadLink = e.target.closest('a[href="#"]');
    if (deadLink) e.preventDefault();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { setView('all'); return; }
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    var order = ['course', 'note', 'web'];
    var i = order.indexOf(readHash());
    var next = e.key === 'ArrowRight'
      ? (i < 0 ? 0 : (i + 1) % order.length)
      : (i < 0 ? order.length - 1 : (i - 1 + order.length) % order.length);
    setView(order[next]);
  });

  window.addEventListener('hashchange', function () { applyView(readHash()); });
  window.addEventListener('resize', fit);
  window.addEventListener('load', function () { requestAnimationFrame(fit); });

  applyView(readHash());
  requestAnimationFrame(fit);
})();
</script>

</body>
