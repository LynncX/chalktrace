<svg viewBox="0 0 680 440" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>系统分层架构</title>
<desc>三个展示消费方共享同一个 runs 产物目录，cv_engine 负责写入，FastAPI 只做任务调度与文件接口</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="30" style="font:400 12px var(--font-sans)" fill="#5F5E5A">展示层 · 三个消费方</text>
<rect x="40" y="48" width="186" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="133" y="70" text-anchor="middle" dominant-baseline="central" style="font:500 14px var(--font-sans)" fill="#0C447C">web/ 用户前端</text>
<text x="133" y="90" text-anchor="middle" dominant-baseline="central" style="font:400 12px var(--font-sans)" fill="#185FA5">H5 或微信小程序</text>
<rect x="247" y="48" width="186" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="70" text-anchor="middle" dominant-baseline="central" style="font:500 14px var(--font-sans)" fill="#0C447C">workbench/ 展示台</text>
<text x="340" y="90" text-anchor="middle" dominant-baseline="central" style="font:400 12px var(--font-sans)" fill="#185FA5">静态 HTML 单页</text>
<rect x="454" y="48" width="186" height="60" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="547" y="70" text-anchor="middle" dominant-baseline="central" style="font:500 14px var(--font-sans)" fill="#0C447C">evaluation/ 评测</text>
<text x="547" y="90" text-anchor="middle" dominant-baseline="central" style="font:400 12px var(--font-sans)" fill="#185FA5">A·B·C·D 对比实验</text>
<path d="M133 160L133 112" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 160L340 112" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M547 160L547 112" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="356" y="140" style="font:400 11px var(--font-sans)" fill="#5F5E5A">只读 manifest.json</text>
<rect x="40" y="160" width="600" height="110" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="60" y="182" style="font:500 14px var(--font-sans)" fill="#0C447C">唯一数据源 · runs/&lt;run_id&gt;/</text>
<text x="620" y="182" text-anchor="end" style="font:400 11px var(--font-sans)" fill="#5F5E5A">一次运行 = 一个目录</text>
<rect x="60" y="196" width="132" height="52" rx="8" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="126" y="214" text-anchor="middle" dominant-baseline="central" style="font:500 12px var(--font-sans)" fill="#0C447C">manifest.json</text>
<text x="126" y="232" text-anchor="middle" dominant-baseline="central" style="font:400 11px var(--font-sans)" fill="#5F5E5A">运行总索引</text>
<rect x="202" y="196" width="132" height="52" rx="8" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="268" y="214" text-anchor="middle" dominant-baseline="central" style="font:500 12px var(--font-sans)" fill="#0C447C">config.yaml</text>
<text x="268" y="232" text-anchor="middle" dominant-baseline="central" style="font:400 11px var(--font-sans)" fill="#5F5E5A">参数快照</text>
<rect x="344" y="196" width="132" height="52" rx="8" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="410" y="214" text-anchor="middle" dominant-baseline="central" style="font:500 12px var(--font-sans)" fill="#0C447C">01–09 阶段目录</text>
<text x="410" y="232" text-anchor="middle" dominant-baseline="central" style="font:400 11px var(--font-sans)" fill="#5F5E5A">中间产物落盘</text>
<rect x="486" y="196" width="132" height="52" rx="8" fill="#FFFFFF" stroke="#B5D4F4" stroke-width="0.5"/>
<text x="552" y="214" text-anchor="middle" dominant-baseline="central" style="font:500 12px var(--font-sans)" fill="#0C447C">最终导出</text>
<text x="552" y="232" text-anchor="middle" dominant-baseline="central" style="font:400 11px var(--font-sans)" fill="#5F5E5A">TXT · PDF · JSON</text>
<path d="M480 320L480 274" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="492" y="300" style="font:400 11px var(--font-sans)" fill="#5F5E5A">写入</text>
<text x="40" y="306" style="font:400 12px var(--font-sans)" fill="#5F5E5A">生产层</text>
<rect x="40" y="320" width="240" height="100" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="160" y="347" text-anchor="middle" dominant-baseline="central" style="font:500 14px var(--font-sans)" fill="#085041">server/ · FastAPI</text>
<text x="160" y="371" text-anchor="middle" dominant-baseline="central" style="font:400 12px var(--font-sans)" fill="#0F6E56">任务队列 / 状态 / 文件接口</text>
<text x="160" y="392" text-anchor="middle" dominant-baseline="central" style="font:400 12px var(--font-sans)" fill="#0F6E56">不做任何 CV 计算</text>
<rect x="320" y="320" width="320" height="100" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="480" y="347" text-anchor="middle" dominant-baseline="central" style="font:500 14px var(--font-sans)" fill="#085041">cv_engine/ · 9 阶段流水线</text>
<text x="480" y="371" text-anchor="middle" dominant-baseline="central" style="font:400 12px var(--font-sans)" fill="#0F6E56">抽帧 → 定位 → 门控 → OCR → 条目跟踪</text>
<text x="480" y="392" text-anchor="middle" dominant-baseline="central" style="font:400 12px var(--font-sans)" fill="#0F6E56">唯一 writer 负责落盘</text>
<path d="M282 370L318 370" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>