# 阶段实现标注 —— 唯一需要人工维护的文件。
# 键须与 partitions/*.yaml 的 no 一致，且必须加引号：YAML 1.1 会把 01 当成八进制整数。
# 字段：files 代码文件 / funcs 核心函数（字符串或 {name, note}）/ params 核心参数 / note 自由备注。
# params 的键避开 on/off/yes/no 等 YAML 1.1 裸键；含 < > 的值请加引号。
# draft=false 表示已有最小实现；具体能力边界见 note，不能等同完整开题方案。

"01":
  draft: false
  files: [cv_engine/stages/s01_frames.py]
  funcs:
    - {name: extract_frames(), note: 按间隔抽帧}
    - {name: blur_score(), note: 拉普拉斯方差筛模糊}
  params: {sample_interval_s: 5, max_frames: 3, blur_min: 0}
  note: 固定间隔采样，默认不丢模糊帧；真实参数以每次 config.yaml 为准。

"02":
  draft: false
  files: [cv_engine/stages/s02_board.py]
  funcs:
    - {name: locate_board(), note: 人工 ROI / 四角透视校正 / 全帧直通}
  params: {roi: 可选, corners: 可选}
  note: 自动定位尚未实现；无标定时不计为定位成功。核验页逐帧配对原图标定和输出，区域外压暗，边界和四角编号仅绘制在核验图，不影响 OCR 输入。标定矩阵支持 OCR 框映射回原帧。

"03":
  draft: true
  files: [cv_engine/stages/s03_pose.py]
  funcs:
    - {name: detect_pose(), note: YOLOv8n-pose}
    - {name: occlusion_iou(), note: 人体框与白板 ROI 交并比}
  params: {OCCLUSION_IOU: 0.30}

"04":
  draft: true
  files: [cv_engine/stages/s04_gate.py]
  funcs:
    - {name: partition_gate(), note: 分区门控 + 短时可见板书保留}
    - {name: ssim_delta(), note: 变化检测}
  params: {SSIM_MAX: 0.88, COOLDOWN_FRAMES: 30, CLARITY_MIN: 0.45, OCCLUSION_SKIP: 0.30}
  note: 阈值取自开题方案，待实测校准。

"05":
  draft: false
  files: [cv_engine/stages/s05_enhance.py]
  funcs:
    - {name: enhance_board(), note: 灰度化 / 自适应增强}
  params: {enhance: clahe 或 none}
  note: 温和灰度 CLAHE，不缩放、不二值化；校正后的原彩色图同时保留。

"06":
  draft: false
  files: [cv_engine/adapters/ocr.py, cv_engine/pipeline.py]
  funcs:
    - {name: OcrEngine.recognize(), note: PaddleOCR，落盘 poly/score/frame/ts}
  params: {det_model: PP-OCRv5_server_det, rec_model: PP-OCRv5_server_rec, score_min: 0}
  note: 单次运行复用模型；poly 是校正板书坐标，source_poly 是原帧坐标，叠加图展示原帧上的框。

"07":
  draft: true
  files: [cv_engine/stages/s07_items.py]
  funcs:
    - {name: merge_items(), note: 连续快照去重，记录首见/末见}
    - {name: bind_evidence(), note: 绑定原帧、裁剪与 OCR 原文}
  params: {DEDUP_WINDOW_S: 待定}

"08":
  draft: false
  files: [cv_engine/pipeline.py]
  funcs:
    - {name: run(), note: 按采样时间串联原文，输出 Markdown / TXT}
  params: {}
  note: 最小原文汇总，不做条目跟踪、跨帧去重或 PDF 导出。

"09":
  draft: false
  files: [cv_engine/pipeline.py]
  funcs:
    - {name: run(), note: 逐阶段耗时 / 帧数 / 进程累计峰值内存}
  params: {}
