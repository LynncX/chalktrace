  - {glob: "media/03_pose/pose_*.jpg", caption: "骨架叠加 · {stem}", limit: 18}
  - {glob: "media/03_pose/occlusion_*.png", caption: "遮挡率 · {stem}", limit: 6}
tables:
  - {path: 03_pose/poses.json, columns: [frame, ts, occlusion], title: 逐帧人体覆盖率估计（0..1）}
folds:
  - {title: 遮挡估计口径, body: "使用 YOLOv8n-pose ONNX。将全部检测人体框投影到校正板书区域，按覆盖并集/板书面积计算 0..1 覆盖率，不是 IoU。人体框可能包含大量空白，所以这是保守估计，不能等同像素级真实遮挡。空检测不等于确认无遮挡；尚未推断教师身份、朝向或行为。阈值见本次 config.yaml。"}
