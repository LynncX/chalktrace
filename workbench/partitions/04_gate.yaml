no: "04"
name: 变化检测与门控
short: 门控
kind: stage
metrics:
  - {label: 采样帧, key: stages.01.metrics.sampled}
  - {label: 门控放行, key: stages.04.metrics.passed}
  - {label: 放行率, key: stages.04.metrics.pass_rate, unit: "%"}
figures:
  - {glob: "media/04_gate/decision_*.jpg", caption: "放行 / 跳过证据 · {stem}", limit: 24}
tables:
  - {path: 04_gate/gate.json, columns: [frame, ts, occlusion, reference_ts, ssim, change_ratio, visible_gain, reason_text, fired], title: 逐帧门控记录（覆盖与变化比例为 0..1）}
folds:
  - {title: 阈值与参考, body: "参考图仅在 OCR 成功后更新。先拒绝人体覆盖超阈值帧，再按秒判断冷却；在当前和参考图共同可见的区域计算 Gaussian SSIM 与灰度差像素比例，二者均满足变化阈值时放行。原先被挡区域显露或共同可见区域不足时保守放行；超过最长刷新间隔也放行，但不能覆盖遮挡拒绝。实际阈值见 config.yaml，均待标注集校准。"}
